<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>WebOps Skill Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<style>
/* Layout: one tool, four tabs. "My map" is the skill tree on a dark board with a side panel; "Review together" is the
   self / manager / agreed table; "Team view" is the manager's big picture (team skill map + heatmap). Files hold the data. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --soft:#F4F7F8; --ink:#17232B; --muted:#56656D; --line:#D7DFE3;
  --board:#141D25; --board-2:#1B2731; --board-line:#2A3946; --board-ink:#E8EEF2; --board-muted:#93A4B0;
  --code:#5B9BFF; --a11y:#3CC6BF; --pub:#4CC585; --adv:#F2A24B; --dsg:#A88EEA; --fr:#DE7FC4;
  --code-d:#2F62C4; --a11y-d:#16827D; --pub-d:#23834F; --adv-d:#A9620F; --dsg-d:#6A4DB5; --fr-d:#A33F87;
  --free:#1F7A50; --free-bg:#E3F4EA; --work:#2D5E9E; --work-bg:#E4EDF8; --course:#8A5A10; --course-bg:#F8EEDC;
  --warn:#B4541A; --warn-bg:#FBEBDD; --ok:#1F7A50;
  --h1:#E6F0F2; --h2:#BFDCE0; --h3:#7FBAC2; --h4:#3D8E9A; --h5:#1D5F6B; --h-ink-dark:#FFFFFF;
  --focus:#2F62C4;
  --f-display:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --f-sans:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1419; --surface:#161F27; --soft:#1B252E; --ink:#E6ECEF; --muted:#9AAAB4; --line:#283641;
    --board:#0B1116; --board-2:#131C24; --board-line:#26333E; --board-ink:#E8EEF2; --board-muted:#8FA0AC;
    --code-d:#7EB0FF; --a11y-d:#5AD3CD; --pub-d:#6BD39B; --adv-d:#F5B56B; --dsg-d:#B9A3F0; --fr-d:#E89BD2;
    --free:#7FD6A6; --free-bg:#16342A; --work:#8FB8F0; --work-bg:#18283C; --course:#F0C27A; --course-bg:#352A16;
    --warn:#F0A570; --warn-bg:#3A2416; --ok:#7FD6A6;
    --h1:#1C2B31; --h2:#1F4A52; --h3:#2D6E78; --h4:#3F96A2; --h5:#7FCBD3; --h-ink-dark:#0B1116;
    --focus:#7EB0FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1419; --surface:#161F27; --soft:#1B252E; --ink:#E6ECEF; --muted:#9AAAB4; --line:#283641;
  --board:#0B1116; --board-2:#131C24; --board-line:#26333E; --board-ink:#E8EEF2; --board-muted:#8FA0AC;
  --code-d:#7EB0FF; --a11y-d:#5AD3CD; --pub-d:#6BD39B; --adv-d:#F5B56B; --dsg-d:#B9A3F0; --fr-d:#E89BD2;
  --free:#7FD6A6; --free-bg:#16342A; --work:#8FB8F0; --work-bg:#18283C; --course:#F0C27A; --course-bg:#352A16;
  --warn:#F0A570; --warn-bg:#3A2416; --ok:#7FD6A6;
  --h1:#1C2B31; --h2:#1F4A52; --h3:#2D6E78; --h4:#3F96A2; --h5:#7FCBD3; --h-ink-dark:#0B1116;
  --focus:#7EB0FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:36px 64px}
@media (max-width:600px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-underline-offset:2px}
.eyebrow{margin:0;font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4.2vw,44px);line-height:1.05;margin:6px 0 0;text-wrap:balance}
.intro{margin:10px 0 0;max-width:72ch;font-size:17px;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;text-wrap:balance}
h3{text-wrap:balance}
.lede{margin:6px 0 0;color:var(--muted);max-width:72ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.k{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:7px 13px;font-size:14px;font-weight:700;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.solid{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{appearance:none;border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:6px 11px;font-size:14px;font-weight:600;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* file bar */
.filebar{margin:22px 0 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) auto;gap:12px 18px;align-items:end}
@media (max-width:900px){.filebar{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;gap:4px;font-size:13.5px;color:var(--muted);font-weight:600}
.field input,.field select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:15.5px;font-weight:600;width:100%}
.fbtns{display:flex;flex-wrap:wrap;gap:8px}
.fstatus{grid-column:1/-1;font-size:13.5px;color:var(--muted);margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fstatus .dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.fstatus.dirty .dot{background:var(--warn)}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:20px 0 0;border-bottom:1px solid var(--line)}
.tabs button{appearance:none;border:0;background:none;padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:15.5px;letter-spacing:.02em;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .cnt{font-family:var(--f-sans);font-size:12px;font-weight:700;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:1px 7px;margin-left:6px}
.tabpanel{padding-top:18px}

/* HUD */
.hud{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,.9fr);gap:14px}
@media (max-width:900px){.hud{grid-template-columns:minmax(0,1fr)}}
.row2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center}
.row2 .lab{font-size:14px;color:var(--muted)}
.ready{display:grid;gap:9px}
.rbar{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.rbar b{font-family:var(--f-display);font-weight:600}
.track{height:10px;border-radius:5px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);border-radius:5px}
.rbar.aim .track i{background:var(--pub-d)}
.rbar span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
.pts{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pts .big{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.pts .of{color:var(--muted)}
.budget{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted)}
.budget input{width:64px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:15px}
.ptbar{height:8px;border-radius:4px;background:var(--soft);border:1px solid var(--line);margin-top:10px;overflow:hidden}
.ptbar i{display:block;height:100%;background:var(--adv-d)}
.ptbar.over i{background:#C8414F}
.freenote{margin:12px 0 0;font-size:15px;color:var(--muted);max-width:90ch}
.freenote b{color:var(--free)}

/* board + panel */
.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;margin:16px 0 0;align-items:start}
@media (max-width:1060px){.main{grid-template-columns:minmax(0,1fr)}}
.board-wrap{background:var(--board);border-radius:18px;padding:16px;min-width:0;color:var(--board-ink)}
.board-scroll{overflow-x:auto}
.board{position:relative;min-width:700px;display:grid;gap:0}
.board svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.bh{padding:8px 4px 14px;text-align:center;font-family:var(--f-display);font-weight:600;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.bh small{display:block;font-family:var(--f-sans);font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--board-muted);font-weight:400}
.tier{display:flex;flex-direction:column;justify-content:center;padding:10px 6px;border-top:1px solid var(--board-line)}
.tier b{font-family:var(--f-display);font-size:19px;font-weight:700}
.tier span{font-size:11.5px;color:var(--board-muted);line-height:1.3}
.tier.aim b{color:var(--pub)}
.cell{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 2px;border-top:1px solid var(--board-line);position:relative;z-index:1}
.node{appearance:none;background:var(--board);border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:128px;max-width:100%;padding:6px 4px;border-radius:12px;color:var(--board-ink)}
.node:hover .badge{transform:translateY(-2px)}
.badge{position:relative;width:58px;height:58px;transition:transform .15s}
.badge svg{width:58px;height:58px;display:block}
.node .nm{font-size:13px;font-weight:600;line-height:1.25;text-align:center}
.node .st{font-size:11px;color:var(--board-muted);font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.node.locked .badge{opacity:.35}
.node.locked .nm{color:var(--board-muted)}
.node[aria-pressed="true"]{background:var(--board-2);box-shadow:0 0 0 2px var(--c)}
.node.avail .badge::after{content:"";position:absolute;right:1px;top:1px;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--board)}
.board-key{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 4px 0;font-size:12.5px;color:var(--board-muted)}
.board-key span{display:inline-flex;align-items:center;gap:6px}
.board-key i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--board-muted)}
@media (prefers-reduced-motion: reduce){.badge{transition:none}}

.panel{position:sticky;top:max(16px,env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px;min-width:0}
@media (max-width:1060px){.panel{position:static}}
.p-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--cd)}
.panel h3{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.15;margin:10px 0 4px}
.panel .req{margin:0;color:var(--muted);font-size:14.5px}
.panel h4{font-family:var(--f-display);font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.panel ul{margin:0;padding-left:19px;display:grid;gap:5px;font-size:15px}
.panel .ev{font-size:15px;margin:0}
.rate{display:grid;gap:4px}
.rate button{appearance:none;border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:6px 10px;font-size:13.5px;cursor:pointer;line-height:1.3;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;text-align:left}
.rate button b{font-family:var(--f-display);font-size:16px;line-height:1.2}
.rate button strong{font-weight:700}
.rate button span{color:var(--muted)}
.rate button[aria-pressed="true"]{background:var(--cd);border-color:var(--cd);color:var(--surface)}
.rate button[aria-pressed="true"] span{color:var(--surface)}
.rdef{margin:8px 0 0;font-size:14px;color:var(--muted);min-height:2.6em}
.others{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13.5px}
.others span{padding:2px 9px;border-radius:7px;background:var(--soft);border:1px solid var(--line)}
.res{list-style:none;padding:0!important;gap:8px!important}
.res li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:start}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap;margin-top:2px;display:inline-block}
.tag.free{background:var(--free-bg);color:var(--free)} .tag.work{background:var(--work-bg);color:var(--work)} .tag.course{background:var(--course-bg);color:var(--course)}
.res a{font-weight:600}
.res small{display:block;color:var(--muted);font-size:13.5px}
.spend{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{appearance:none;border:0;background:var(--soft);width:40px;height:40px;font-size:20px;font-weight:700;cursor:pointer}
.step output{min-width:64px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted)}
.locknote{margin:12px 0 0;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}

.lower{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:16px;margin:16px 0 0}
@media (max-width:1000px){.lower{grid-template-columns:minmax(0,1fr)}}
.radar svg{display:block;width:100%;max-width:460px;height:auto;margin:0 auto}
.radar text{font-family:var(--f-sans);fill:var(--ink)}
.rleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.rleg span{display:inline-flex;align-items:center;gap:6px}
.rleg i{width:14px;height:3px;border-radius:2px;background:var(--c)}
.sugg{display:grid;gap:8px}
.sugg button{appearance:none;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 12px;cursor:pointer}
.sugg button i{width:12px;height:12px;border-radius:50%;background:var(--cd)}
.sugg button span{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:14.5px;margin:4px 0 0}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.plan li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px;padding:6px 0;border-bottom:1px solid var(--line)}
.plan li i{width:12px;height:12px;border-radius:50%;background:var(--cd)}
.plan li b{font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* French */
.sec{margin:40px 0 0;padding-top:26px;border-top:1px solid var(--line)}
.fr-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:16px;align-items:start}
@media (max-width:1060px){.fr-grid{grid-template-columns:minmax(0,1fr)}}
.path{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;counter-reset:f}
@media (max-width:760px){.path{grid-template-columns:minmax(0,1fr)}}
.path>li{counter-increment:f;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:6px}
.path>li::before{content:counter(f);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);border:2px solid var(--fr-d);color:var(--fr-d);font-family:var(--f-display);font-weight:700}
.path>li.rec{box-shadow:0 0 0 2px var(--fr-d) inset;border-color:var(--fr-d)}
.path>li.rec::before{background:var(--fr-d);color:var(--surface)}
.path h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:2px 0 0}
.path .who{font-size:13px;font-weight:700;color:var(--fr-d)}
.path p{margin:0;font-size:14.5px;color:var(--muted)}
.path ul{margin:2px 0 0;padding-left:18px;font-size:14px;display:grid;gap:4px}
.path a{font-weight:600}
.path .fund{margin-top:auto;padding-top:6px}
.sel{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 10px;align-items:center;margin-top:6px}
.sel label{font-size:14px;font-weight:600}
.sel select{width:100%;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:14.5px}
.gap{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-size:15px}
.note{font-size:13.5px;color:var(--muted);margin:10px 0 0}

/* review */
.rv-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.rv-actions{display:flex;flex-wrap:wrap;gap:8px}
.tblwrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.rv{width:100%;border-collapse:collapse;font-size:14.5px;min-width:760px}
.rv th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 10px;border-bottom:1px solid var(--line);background:var(--soft);position:sticky;top:0}
.rv td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.rv tr.grp td{background:var(--soft);font-family:var(--f-display);font-weight:600;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--cd)}
.rv td.nm b{font-weight:600}
.rv td.nm small{color:var(--muted);margin-left:6px}
.rv .val{font-family:var(--f-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.rv select{padding:5px 6px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:14px;min-width:120px}
.rv .mini{appearance:none;border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:3px 8px;font-size:12.5px;font-weight:700;cursor:pointer}
.flag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.okflag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--free-bg);color:var(--free)}
.delta{font-size:12.5px;font-weight:700;color:var(--ok)}
.delta.dn{color:var(--warn)}
.hist{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px;font-size:14px}
.hist li{display:flex;gap:10px;flex-wrap:wrap}

/* team */
.tm-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.drop{margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted);font-size:14.5px}
.drop.over{border-color:var(--focus);color:var(--ink)}
.insights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:1000px){.insights{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.insights{grid-template-columns:minmax(0,1fr)}}
.ins h3{font-family:var(--f-display);font-size:15.5px;font-weight:700;margin:0 0 6px}
.ins ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:3px}
.ins .num{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1}
.tm-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:1000px){.tm-grid{grid-template-columns:minmax(0,1fr)}}
table.heat{border-collapse:separate;border-spacing:2px;font-size:13px}
.heat th{font-weight:600;color:var(--muted)}
.heat th.sk{height:150px;vertical-align:bottom;padding:0 0 6px}
.heat th.sk span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;display:inline-block;max-height:146px;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--ink)}
.heat th.br{font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--cd);text-align:left;padding:4px;border-bottom:3px solid var(--cd)}
.heat td{width:30px;height:30px;text-align:center;border-radius:6px;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.heat td.pn{width:auto;text-align:left;font-family:var(--f-sans);font-weight:600;white-space:nowrap;padding:0 10px 0 2px;border-radius:0}
.heat td.pn small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.heat td.v0{background:var(--soft);color:var(--muted)}
.heat td.v1{background:var(--h1)} .heat td.v2{background:var(--h2)} .heat td.v3{background:var(--h3);color:var(--h-ink-dark)} .heat td.v4{background:var(--h4);color:var(--h-ink-dark)} .heat td.v5{background:var(--h5);color:var(--h-ink-dark)}
.heat td.selfonly{outline:2px dashed var(--muted);outline-offset:-3px}
.heat td.cov{background:none;color:var(--muted);font-size:12px}
.heat td.cov.zero{color:var(--warn)}
.heat td.fr{width:auto;font-family:var(--f-sans);font-weight:600;font-size:12.5px;padding:0 8px;white-space:nowrap;background:var(--soft)}
.hkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px;align-items:center}
.hkey i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:4px}

/* how it works */
.how{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.how{grid-template-columns:minmax(0,1fr)}}
.cycle{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:c}
.cycle li{counter-increment:c;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start}
.cycle li::before{content:counter(c);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);font-family:var(--f-display);font-weight:700;font-size:14px}
.cycle b{display:block}
.cycle span{color:var(--muted);font-size:14.5px}
table.scale{width:100%;border-collapse:collapse;font-size:14.5px}
.scale td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.scale td:first-child{white-space:nowrap;font-family:var(--f-display);font-weight:700}
.warnbox{margin:16px 0 0;padding:14px 16px;border-radius:12px;background:var(--warn-bg);color:var(--ink);font-size:15px}
.warnbox b{color:var(--warn)}
.topbar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.topbar .btn{min-height:34px;padding:5px 12px;font-size:13.5px}
footer{margin:44px 0 0;font-size:13.5px;color:var(--muted);max-width:92ch}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

function localize(base,fr){
  if(LANG!=="fr") return base;
  const resFR=x=>{ const m=x.url&&RES_FR[x.url]; return m?{t:m[0],url:m[1]||x.url}:{}; };
  return {...base, REQ_LABEL:fr.REQ_LABEL,
    LEVELS:base.LEVELS.map(l=>({...l,name:fr.LEVELS[l.id]||l.name})),
    BRANCHES:base.BRANCHES.map(b=>{ const f=fr.BRANCHES[b.id]; return f?{...b,name:f[0],sub:f[1]}:b; }),
    SKILLS:base.SKILLS.map(s=>{ const f=fr.SKILLS[s.id]; if(!f) return s;
      return {...s,name:f.name,req:f.req,can:f.can,show:f.show,learn:s.learn.map((x,i)=>{ const o=(f.learn||[])[i]||[]; const r=resFR(x); return {...x,...r,t:o[0]||r.t||x.t,note:o[1]||null}; })}; }),

  const s=e.target.value; if(s===M.stream) return;
  if(Object.keys(M.ratings).length) confirmInline(t("confirmSwitch"),()=>startNew(s,M.name),()=>{ e.target.value=M.stream; });
  else { const n=M.name; M=blankMap(s); M.name=n; sel=null; touch(); renderAll(); }
});
$("#bNew").addEventListener("click",()=>{ if(dirty) confirmInline(t("confirmNew"),()=>startNew(M.stream,""),null); else startNew(M.stream,""); });
const slug=s=>(s||"me").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"me";
async function readFile(f){ return normalize(JSON.parse(await f.text())); }
function loaded(m,h,name){ M=m; handle=h; fileName=name; dirty=false; sel=null; saveDraft(); renderAll(); say(t("opened",{f:name})); }
$("#bOpen").addEventListener("click",async()=>{
  if(window.showOpenFilePicker){
    try{ const [h]=await window.showOpenFilePicker({types:[{description:"Skill map",accept:{"application/json":[".json"]}}]}); loaded(await readFile(await h.getFile()),h,h.name); }
    catch(e){ if(e.name!=="AbortError") say(e.message||t("cantOpen")); }
  } else $("#fileOne").click();
});
$("#fileOne").addEventListener("change",async e=>{ const f=e.target.files[0]; if(!f) return;
  try{ loaded(await readFile(f),null,f.name); }catch(er){ say(er.message||t("cantOpen")); } e.target.value=""; });
$("#bSave").addEventListener("click",save);
async function save(){
  M.updated=new Date().toISOString();
  const data=JSON.stringify(M,null,1); const name=fileName||`skillmap-${slug(M.name)}.json`;
  try{
    if(handle&&handle.createWritable){ const w=await handle.createWritable(); await w.write(data); await w.close(); }
    else if(window.showSaveFilePicker){ const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:"Skill map",accept:{"application/json":[".json"]}}]}); const w=await h.createWritable(); await w.write(data); await w.close(); handle=h; fileName=h.name; }
    else { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); fileName=name; }
    dirty=false; saveDraft(); renderFileBar(); say(t("saved",{f:fileName}));
  }catch(e){ if(e.name!=="AbortError") say(t("cantSave")); }
}
function say(x){ $("#fstatusT").textContent=x; setTimeout(renderFileBar,3500); }
window.addEventListener("beforeunload",e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });

function renderHUD(){
  const L=ST().LEVELS;
  const seg=(el,key)=>{ el.innerHTML=L.map(l=>`<button type="button" data-${key}="${l.id}" aria-pressed="${M[key]===l.id}">${l.id}</button>`).join(""); };
  seg($("#curSeg"),"cur"); seg($("#aimSeg"),"aim");
  $("#ready").innerHTML=L.map(l=>{ const sk=ST().SKILLS.filter(s=>s.lv===l.id), ok=sk.filter(s=>eff(s.id)>=3).length;
    return `<div class="rbar${M.aim===l.id?" aim":""}"><b>${l.id}</b><div class="track" role="img" aria-label="${esc(t("ofN",{a:ok,b:sk.length}))}"><i style="width:${ok/sk.length*100}%"></i></div><span>${esc(t("ofN",{a:ok,b:sk.length}))}</span></div>`; }).join("");
  const used=Object.values(M.plan).reduce((a,b)=>a+b,0), left=M.budget-used;

  const bar=$("#ptbar"); bar.classList.toggle("over",left<0); bar.firstElementChild.style.width=Math.min(100,M.budget?used/M.budget*100:0)+"%";
  $("#budget").value=M.budget;
}

function badge(s,b){ const v=eff(s.id), C=2*Math.PI*26;
  return `<svg viewBox="0 0 60 60" aria-hidden="true" style="color:${v>=3?"var(--board)":b.c}">
    <circle cx="30" cy="30" r="26" fill="${v>=3?b.c:"var(--board-2)"}" stroke="var(--board-line)" stroke-width="4"/>
    <circle cx="30" cy="30" r="26" fill="none" stroke="${b.c}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C*v/5} ${C}" transform="rotate(-90 30 30)"/>
    ${ICON[b.icon]||""}</svg>`; }
function renderBoard(){
  const st=ST(), bd=$("#board");
  if(!sel||!SID()[sel]) sel=st.SKILLS[0].id;
  bd.style.gridTemplateColumns=`84px repeat(${st.BRANCHES.length},minmax(0,1fr))`;
  let h=`<svg class="links" id="links" aria-hidden="true"></svg><div></div>`;
  h+=st.BRANCHES.map(b=>`<div class="bh" style="--c:${b.c}">${esc(b.name)}<small>${esc(b.sub)}</small></div>`).join("");
  st.LEVELS.forEach(l=>{ const aim=l.id===M.aim;
    h+=`<div class="tier${aim?" aim":""}"><b>${l.id}</b><span>${esc(l.name)}${l.id===M.cur?"<br>"+esc(t("nowTier")):aim?"<br>"+esc(t("aimTier")):""}</span></div>`;
    st.BRANCHES.forEach(b=>{ const sk=st.SKILLS.filter(s=>s.b===b.id&&s.lv===l.id);
      h+=`<div class="cell">`+sk.map(s=>{ const v=eff(s.id), un=unlocked(s), cls=!un?"locked":(v<3?"avail":"");
        const lab=v?SCALE[v-1].n:"";
        return `<button type="button" class="node ${cls}" data-node="${s.id}" aria-pressed="${sel===s.id}" style="--c:${b.c}" aria-label="${esc(s.name)}, ${l.id}, ${esc(v?lab:t("notRatedAria"))}${un?"":", "+esc(t("needsFirstAria"))}"><span class="badge" data-badge="${s.id}">${badge(s,b)}</span><span class="nm">${esc(s.name)}</span><span class="st">${esc(lab)}</span></button>`; }).join("")+`</div>`; }); });
  bd.innerHTML=h;
  $("#boardKey").innerHTML=`<span><i style="background:var(--pub);border-color:var(--pub)"></i>${esc(t("readyKey"))}</span><span><i style="opacity:.45"></i>${esc(t("dimKey"))}</span><span>${esc(t("filledKey"))}</span>${M.stream==="advisor"?`<span>${esc(t("squadKey"))}</span>`:""}`;
  requestAnimationFrame(drawLinks);
}
function drawLinks(){
  const bd=$("#board"), svg=$("#links"); if(!bd||!svg||!bd.offsetParent) return;
  const R0=bd.getBoundingClientRect(), sid=SID(), bid=BID(); let p="";
  ST().SKILLS.forEach(s=>s.pre.forEach(pid=>{ if(s.id!==sel&&pid!==sel) return;
    const a=bd.querySelector(`[data-badge="${pid}"]`), b=bd.querySelector(`[data-badge="${s.id}"]`); if(!a||!b) return;
    const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
    const x1=ra.left+ra.width/2-R0.left, y1=ra.bottom-R0.top+2, x2=rb.left+rb.width/2-R0.left, y2=rb.top-R0.top-2, my=(y1+y2)/2;
    const done=eff(pid)>=2, col=bid[sid[pid].b].c;
    const blocked=Math.abs(x1-x2)<4&&[...bd.querySelectorAll("[data-badge]")].some(o=>{ if(o===a||o===b) return false; const r=o.getBoundingClientRect(), cx=r.left+r.width/2-R0.left, cy=r.top+r.height/2-R0.top; return Math.abs(cx-x1)<4&&cy>y1&&cy<y2; });
    const d=blocked?`M${x1+30} ${y1-32} C ${x1+95} ${y1-20}, ${x2+95} ${y2+20}, ${x2+30} ${y2+32}`:`M${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;
    p+=`<path d="${d}" fill="none" stroke="${done?col:"var(--board-muted)"}" stroke-width="${done?3:2}" ${done?"":'stroke-dasharray="4 5"'}/>`; }));
  svg.innerHTML=p;
}
new ResizeObserver(()=>drawLinks()).observe(document.getElementById("board"));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(drawLinks);

/* ---------- radar ---------- */
function branchScores(m){ const st=STREAMS[m.stream], li=Object.fromEntries(st.LEVELS.map((l,i)=>[l.id,i])), aimI=li[m.aim];
  return st.BRANCHES.map(b=>{ let sk=st.SKILLS.filter(s=>s.b===b.id&&li[s.lv]<=aimI); if(!sk.length) sk=st.SKILLS.filter(s=>s.b===b.id);
    return sk.reduce((a,s)=>a+effOf(m,s.id),0)/sk.length; }); }
function radar(axes,series,size=340){
  const cx=size/2, cy=size/2+4, r=size/2-84, n=axes.length, ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*r*v/5, cy+Math.sin(ang(i))*r*v/5];
  let s=`<svg viewBox="-60 0 ${size+120} ${size}" role="img" aria-label="${esc(t("radarLabel"))}">`;
  for(let k=1;k<=5;k++) s+=`<polygon points="${axes.map((_,i)=>pt(i,k).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="${k===5?1.5:1}"/>`;
  axes.forEach((a,i)=>{ const [x,y]=pt(i,5); s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const [lx,ly]=pt(i,6.1); const anchor=Math.abs(lx-cx)<8?"middle":lx>cx?"start":"end";
    const w=String(a.name).split(" "); let l1=a.name,l2=""; if(a.name.length>11&&w.length>1){ let best=1,bd=1e9; for(let k=1;k<w.length;k++){ const d=Math.abs(w.slice(0,k).join(" ").length-w.slice(k).join(" ").length); if(d<bd){bd=d;best=k;} } l1=w.slice(0,best).join(" "); l2=w.slice(best).join(" "); }
    const yy=ly+4-(l2?7:0); s+=`<text x="${lx}" y="${yy}" text-anchor="${anchor}" font-size="12" font-weight="600" style="fill:${a.c}">${esc(l1)}${l2?`<tspan x="${lx}" dy="14">${esc(l2)}</tspan>`:""}</text>`; });
  [1,3,5].forEach(k=>{ const [x,y]=pt(0,k); s+=`<text x="${x+4}" y="${y+3}" font-size="10" style="fill:var(--muted)">${k}</text>`; });
  series.forEach(se=>{ s+=`<polygon points="${se.values.map((v,i)=>pt(i,Math.max(0,v)).join(",")).join(" ")}" fill="${se.fill||"none"}" stroke="${se.color}" stroke-width="${se.w||2.5}" ${se.dash?'stroke-dasharray="5 5"':""} stroke-linejoin="round" opacity="${se.op||1}"/>`; });
  return s+`</svg>`; }

function renderLower(){
  const st=ST(), li=LI(), aimI=li[M.aim], sid=SID(), bid=BID();
  const axes=st.BRANCHES.map(b=>({name:b.name,c:b.cd}));
  $("#myRadar").innerHTML=radar(axes,[{values:axes.map(()=>3),color:"var(--muted)",dash:true,w:1.5},{values:branchScores(M),color:"var(--pub-d)",fill:"color-mix(in srgb, var(--pub-d) 18%, transparent)"}]);

}

function frGaps(f){ if(f.t==="none") return []; const need=f.t.split(""), have=[f.r,f.w,f.o], names=[t("reading"),t("writing"),t("oral")];

  $("#rvTitle").textContent=M.name?t("rvTitleName",{n:M.name}):t("rvTitle");

  let h=`<thead><tr><th scope="col">${esc(t("thSkill"))}</th><th scope="col">${esc(t("thEmp"))}</th><th scope="col">${esc(t("thMgr"))}</th><th scope="col">${esc(t("thAgr"))}</th><th scope="col">${esc(t("thSince"))}</th><th scope="col"></th></tr></thead><tbody>`;
  st.BRANCHES.forEach(b=>{ h+=`<tr class="grp" style="--cd:${b.cd}"><td colspan="6">${esc(b.name)}</td></tr>`;
    st.SKILLS.filter(s=>s.b===b.id).forEach(s=>{ const r=R(s.id), gap=r.self&&r.mgr&&Math.abs(r.self-r.mgr)>=2;
      const prev=last&&last.agreed?last.agreed[s.id]||0:0, d=r.agreed&&prev?r.agreed-prev:0;
      h+=`<tr><td class="nm"><b>${esc(s.name)}</b><small>${s.lv}</small></td>
        <td><span class="val">${r.self||"–"}</span></td>
        <td><select data-mgr="${s.id}" aria-label="${esc(t("mgrFor",{s:s.name}))}">${opts(r.mgr||0,t("notRated"))}</select></td>
        <td><select data-agr="${s.id}" aria-label="${esc(t("agrFor",{s:s.name}))}">${opts(r.agreed||0,t("notAgreed"))}</select></td>
        <td>${d?`<span class="delta${d<0?" dn":""}">${d>0?"+":""}${d}</span>`:""}</td>
        <td>${gap?`<span class="flag">${esc(t("talk"))}</span>`:r.agreed?`<span class="okflag">${esc(t("agreedFlag"))}</span>`:(r.self&&r.mgr?`<button type="button" class="mini" data-use="${s.id}">${esc(t("useN",{n:Math.round((r.self+r.mgr)/2)}))}</button>`:"")}</td></tr>`; }); });
  $("#rvTable").innerHTML=h+`</tbody>`;
  $("#hist").innerHTML=M.history.length?M.history.slice().reverse().map(x=>{ const n=Object.values(x.agreed||{}).filter(Boolean).length; return `<li><b>${esc(x.date)}</b><span>${esc(t("histItem",{n}))}</span></li>`; }).join(""):`<li class="empty">${esc(t("noHist"))}</li>`;
}
$("#rvTable").addEventListener("change",e=>{ const m=e.target.closest("[data-mgr]"), a=e.target.closest("[data-agr]");
  if(m){ const id=m.dataset.mgr; M.ratings[id]={...(M.ratings[id]||{}),mgr:+m.value}; }
  if(a){ const id=a.dataset.agr; M.ratings[id]={...(M.ratings[id]||{}),agreed:+a.value}; }
  touch(); renderReview(); renderMap(); });
$("#rvTable").addEventListener("click",e=>{ const u=e.target.closest("[data-use]"); if(!u) return; const id=u.dataset.use, r=R(id); M.ratings[id]={...r,agreed:Math.round((r.self+r.mgr)/2)}; touch(); renderReview(); renderMap(); });
$("#bMatch").addEventListener("click",()=>{ ST().SKILLS.forEach(s=>{ const r=R(s.id); if(r.self&&r.mgr&&r.self===r.mgr&&!r.agreed) M.ratings[s.id]={...r,agreed:r.self}; }); touch(); renderReview(); renderMap(); });
$("#bSign").addEventListener("click",()=>{ const agreed={}; ST().SKILLS.forEach(s=>{ if(R(s.id).agreed) agreed[s.id]=R(s.id).agreed; });
  if(!Object.keys(agreed).length){ say(t("needAgreed")); return; }
  const d=today(); const i=M.history.findIndex(x=>x.date===d); const snap={date:d,cur:M.cur,aim:M.aim,agreed};
  if(i>=0) M.history[i]=snap; else M.history.push(snap); touch(); renderReview(); say(t("recorded",{d})); });

/* ---------- team ---------- */
let TEAM=[], tmStream="coder";
function addTeamMaps(list){ list.forEach(({m,file})=>{ const k=(m.name||file)+"|"+m.stream; const i=TEAM.findIndex(x=>x.key===k); const rec={key:k,m,file}; if(i>=0) TEAM[i]=rec; else TEAM.push(rec); });
  if(TEAM.length&&!TEAM.some(x=>x.m.stream===tmStream)) tmStream=TEAM[0].m.stream; renderTeam(); }
async function loadFiles(files){ const ok=[], bad=[]; for(const f of files){ try{ ok.push({m:await readFile(f),file:f.name}); }catch(e){ bad.push(f.name); } }
  addTeamMaps(ok); $("#drop").textContent=bad.length?t("skipped",{n:bad.length,f:bad.join(", ")}):t("drop"); }
$("#bTeam").addEventListener("click",async()=>{ if(window.showOpenFilePicker){ try{ const hs=await window.showOpenFilePicker({multiple:true,types:[{description:"Skill maps",accept:{"application/json":[".json"]}}]}); loadFiles(await Promise.all(hs.map(h=>h.getFile()))); }catch(e){} } else $("#fileMany").click(); });
$("#fileMany").addEventListener("change",e=>{ loadFiles([...e.target.files]); e.target.value=""; });
const drop=$("#drop");
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop",e=>{ loadFiles([...e.dataTransfer.files]); });
$("#bClearTeam").addEventListener("click",()=>{ TEAM=[]; renderTeam(); });
$("#bSample").addEventListener("click",()=>{ addTeamMaps(sampleTeam()); });
$("#tmStream").addEventListener("click",e=>{ const b=e.target.closest("[data-tms]"); if(!b) return; tmStream=b.dataset.tms; renderTeam(); });
function sampleTeam(){
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const tag=t("sampleTag");
  const people=[["Alex","coder","IS-02","IS-03",0],["Bao","coder","IS-03","IS-04",1],["Chloé","coder","IS-02","IS-02",-.5],["Dev","coder","IS-04","IS-04",2],["Emma","coder","IS-03","IS-03",.6],
    ["Farah","advisor","IS-03","IS-04",0],["Gabriel","advisor","IS-04","IS-05",1],["Hana","advisor","IS-05","IS-05",2],["Isaac","advisor","IS-04","IS-04",.4]];
  return people.map(([nm,stream,cur,aim,boost])=>{ const m=blankMap(stream); m.name=`${tag}${C()}${nm}`; m.cur=cur; m.aim=aim; const st=STREAMS[stream], li=Object.fromEntries(st.LEVELS.map((l,i)=>[l.id,i]));
    st.SKILLS.forEach(s=>{ let v=Math.max(1,Math.min(5,Math.round(3+li[cur]-li[s.lv]+boost+(rnd()-.5)*2.2))); if(s.id==="pm"&&nm==="Dev") v=4; if(s.id==="a11yas") v=Math.min(v,nm==="Dev"?4:2);
      const self=Math.max(1,Math.min(5,v+(rnd()<.25?1:0))); const agreed=rnd()<.8?v:0; m.ratings[s.id]={self,mgr:agreed?v:0,agreed}; });
    st.SKILLS.filter(s=>li[s.lv]>=li[cur]).slice(0,2).forEach((s,i)=>{ m.plan[s.id]=4+i*2; });
    m.fr={r:"B",w:rnd()<.5?"A":"B",o:"B",t:stream==="advisor"?"CBC":(rnd()<.5?"BBB":"none")};
    m.history=[{date:"2026-04-15",cur,aim,agreed:{}}]; return {m,file:"(sample)"}; });
}
const PAL=["#2F62C4","#C8414F","#23834F","#A9620F","#6A4DB5","#16827D","#A33F87","#5E6B76","#B4541A","#3D8E9A"];
function renderTeam(){
  const box=$("#teamBody"); const streams=[...new Set(TEAM.map(x=>x.m.stream))];
  $("#tmStream").innerHTML=streams.length>1?Object.entries(STREAMS).filter(([k])=>streams.includes(k)).map(([k,v])=>`<button type="button" data-tms="${k}" aria-pressed="${tmStream===k}">${esc(v.label)}</button>`).join(""):"";
  const people=TEAM.filter(x=>x.m.stream===tmStream).map(x=>x.m).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  if(!people.length){ box.innerHTML=`<div class="card" style="margin-top:16px"><p class="empty" style="margin:0">${esc(t("tmEmpty"))}</p></div>`; return; }
  const st=STREAMS[tmStream], li=Object.fromEntries(st.LEVELS.map((l,i)=>[l.id,i]));
  const maxAim=Math.max(...people.map(p=>li[p.aim]));
  const cov=Object.fromEntries(st.SKILLS.map(s=>[s.id,people.filter(p=>effOf(p,s.id)>=3)]));
  const noOne=st.SKILLS.filter(s=>li[s.lv]<=maxAim&&cov[s.id].length===0);
  const oneOnly=st.SKILLS.filter(s=>cov[s.id].length===1);
  const ready=people.filter(p=>li[p.aim]>li[p.cur]&&st.SKILLS.filter(s=>li[s.lv]<=li[p.aim]).every(s=>effOf(p,s.id)>=3));
  const pending=people.filter(p=>st.SKILLS.some(s=>{ const r=p.ratings[s.id]||{}; return r.self&&!r.agreed; }));
  const hours={}; let tot=0; people.forEach(p=>Object.entries(p.plan).forEach(([k,v])=>{ hours[k]=(hours[k]||0)+v; tot+=v; }));
  const topH=Object.entries(hours).filter(([k])=>st.SKILLS.some(s=>s.id===k)).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const sname=id=>esc(st.SKILLS.find(s=>s.id===id).name);
  const nm=p=>esc(p.name||t("unnamed"));
  let h=`<div class="insights">
    <div class="card ins"><h3>${esc(t("insNoOne"))}</h3>${noOne.length?`<ul>${noOne.slice(0,6).map(s=>`<li>${esc(s.name)} <small style="color:var(--muted)">${s.lv}</small></li>`).join("")}${noOne.length>6?`<li>${esc(t("andMore",{n:noOne.length-6}))}</li>`:""}</ul>`:`<p class="empty">${esc(t("insNoOneOk",{l:st.LEVELS[maxAim].id}))}</p>`}</div>
    <div class="card ins"><h3>${esc(t("insSpof"))}</h3>${oneOnly.length?`<ul>${oneOnly.slice(0,6).map(s=>`<li>${esc(t("insSpofItem",{s:s.name,p:cov[s.id][0].name||t("onePerson")}))}</li>`).join("")}${oneOnly.length>6?`<li>${esc(t("andMore",{n:oneOnly.length-6}))}</li>`:""}</ul>`:`<p class="empty">${esc(t("insSpofOk"))}</p>`}</div>
    <div class="card ins"><h3>${esc(t("insReady"))}</h3>${ready.length?`<ul>${ready.map(p=>`<li>${nm(p)}${C()}${p.cur} → ${p.aim}</li>`).join("")}</ul>`:`<p class="empty">${esc(t("insReadyNone"))}</p>`}<h3 style="margin-top:12px">${esc(t("insPending"))}</h3>${pending.length?`<ul>${pending.map(p=>`<li>${nm(p)}</li>`).join("")}</ul>`:`<p class="empty">${esc(t("insPendingNone"))}</p>`}</div>
    <div class="card ins"><h3>${esc(t("insHours"))}</h3><p class="num">${tot} h</p><p class="empty" style="margin-top:6px">${esc(t("insHoursSub",{n:people.length}))}</p>${topH.length?`<ul style="margin-top:8px">${topH.map(([k,v])=>`<li>${sname(k)}${C()}${v} h</li>`).join("")}</ul>`:""}</div>
  </div>`;
  const axes=st.BRANCHES.map(b=>({name:b.name,c:b.cd}));
  const series=people.map((p,i)=>({values:branchScores(p),color:PAL[i%PAL.length],w:2,op:.9}));
  h+=`<div class="tm-grid"><div class="card radar"><p class="k">${esc(t("kTeamMap"))}</p>${radar(axes,[{values:axes.map(()=>3),color:"var(--muted)",dash:true,w:1.5},...series])}
    <div class="rleg">${people.map((p,i)=>`<span style="--c:${PAL[i%PAL.length]}"><i></i>${nm(p)}</span>`).join("")}</div>
    <p class="note">${esc(t("teamMapNote"))}</p></div>
    <div class="card" style="min-width:0"><p class="k">${esc(t("kHeat"))}</p><div style="overflow-x:auto"><table class="heat"><thead><tr><th></th>`;
  st.BRANCHES.forEach(b=>{ const n=st.SKILLS.filter(s=>s.b===b.id).length; h+=`<th class="br" colspan="${n}" style="--cd:${b.cd}">${esc(b.name)}</th>`; });
  h+=`<th></th></tr><tr><th></th>`;
  const order=st.BRANCHES.flatMap(b=>st.SKILLS.filter(s=>s.b===b.id));
  order.forEach(s=>{ h+=`<th class="sk" scope="col"><span title="${esc(s.name)} (${s.lv})">${esc(s.name)}</span></th>`; });
  h+=`<th class="sk" scope="col"><span>${esc(t("frCol"))}</span></th></tr></thead><tbody>`;
  people.forEach(p=>{ h+=`<tr><td class="pn">${nm(p)}<small>${p.cur} → ${p.aim}</small></td>`;
    order.forEach(s=>{ const r=p.ratings[s.id]||{}, v=r.agreed||r.self||0, so=!r.agreed&&r.self;
      h+=`<td class="v${v}${so?" selfonly":""}" title="${esc(s.name)}${C()}${v?v+" "+esc(SCALE[v-1].n):esc(t("notRatedLow"))}${so?esc(t("selfOnlyTip")):""}">${v||""}</td>`; });
    const g=frGaps(p.fr); h+=`<td class="fr" title="${esc(p.fr.t==="none"?t("frTipNone"):t("frTipTarget",{t:p.fr.t}))}">${p.fr.t==="none"?"–":g.length?esc(p.fr.t)+C()+esc(t("gapShort")):esc(p.fr.t)+" ✓"}</td></tr>`; });
  h+=`<tr><td class="pn"><small>${esc(t("atLeast3"))}</small></td>`+order.map(s=>`<td class="cov${cov[s.id].length?"":" zero"}">${cov[s.id].length}</td>`).join("")+`<td></td></tr>`;
  h+=`</tbody></table></div>
    <div class="hkey">${SCALE.map(x=>`<span><i style="background:var(--h${x.v})"></i>${x.v} ${esc(x.n)}</span>`).join("")}<span><i style="outline:2px dashed var(--muted);outline-offset:-3px;background:var(--soft)"></i>${esc(t("selfOnly"))}</span></div></div></div>`;
  box.innerHTML=h;
}

/* ---------- render ---------- */
function renderMap(){ renderHUD(); renderBoard(); renderPanel(); renderLower(); renderFileBar(); }
function renderAll(){ renderMap(); renderFrench(); if(!$("#p-rev").hidden) renderReview(); }
applyStatic(); renderAll();
