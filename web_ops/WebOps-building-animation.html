/* One 16:9 stage, scaled to fit the window. A single light look on purpose: it is also the frame you record for a video.
   Left: the story panel (title, caption). Right: the building cutaway. */
:root{
  --page:#E9EEEC; --paper:#F2F5F4; --card:#FFFFFF; --ink:#1E2B32; --muted:#5A6A70; --faint:#9AA8AD; --rule:#DCE4E1;
  --frame:#34434B; --unit:#FBFCFC; --svc:#EAF1F4; --shaft:#DDE6EB; --lobby:#E6EDEA; --soil:#E1E7E4; --soil-line:#D0D9D5; --found:#CBD5D1;
  --hl:#FFF3CC; --law:#9A4A2E; --law-bg:#F8ECE6; --hut:#FFF6DA;
  --loop:#E9B634; --loop-ink:#8A6A12;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-sans:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-sans);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.stage{width:min(100%,calc((100vh - 110px) * 16 / 9));aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(30,43,50,.06),0 18px 40px -18px rgba(30,43,50,.25);background:var(--paper)}
.stage svg{display:block;width:100%;height:100%}
svg text{font-family:var(--f-sans)}
svg text:not([fill]){fill:var(--ink)}
.disp{font-family:var(--f-display)!important;font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:100%}
.controls button{appearance:none;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:36px}
.controls button:hover{border-color:var(--muted)}
.controls button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.controls button i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink))}
.controls .play{background:var(--ink);color:var(--card);border-color:var(--ink);min-width:92px;justify-content:center}
.scrub{width:min(560px,90vw);accent-color:#2C6E73}
body.capture{padding:0;background:var(--paper)} body.capture .controls,body.capture .scrubrow{display:none} body.capture .stage{width:1280px;height:720px;border-radius:0;box-shadow:none}
.scrubrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rm-note{display:none;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){ .rm-note{display:block} }
.err{max-width:900px;background:#FBECEA;border:1px solid #E7B4AE;color:#7A1D16;border-radius:12px;padding:14px 18px;font-size:15px;line-height:1.5}
.err b{display:block;font-size:16px;margin-bottom:4px}
:focus-visible{outline:2px solid #2C6E73;outline-offset:3px}
</style>

</svg></div>

const rulesB={x:1008,y:30,w:BX2-1008,h:46};
el("rect",{x:rulesB.x,y:rulesB.y,width:rulesB.w,height:rulesB.h,rx:6,fill:"var(--law-bg)",stroke:"var(--law)","stroke-width":1.5},B.roof);

txt(LABELS.rulesSub,{x:rulesB.x+12,y:rulesB.y+35,"font-size":10.5,fill:"var(--law)"},B.roof);
[836,944].forEach(x=>el("rect",{x,y:74,width:6,height:10,fill:"var(--frame)"},B.roof));
// loop: the fire escape

el("path",{d:`M${hut.x1} ${hut.cy+6} H${FX} V${deskY} H${deskX1}`,fill:"none",stroke:"var(--loop)","stroke-width":6,"stroke-linecap":"round","stroke-linejoin":"round"},B.loop);
[(aTop+aBot)/2,(fTop+fBot)/2].forEach(y=>el("path",{d:`M${FX-6} ${y} l6 9 l6 -9 z`,fill:"var(--loop-ink)"},B.loop));
// elevators
const elevG={};
ELEVATORS.forEach(e=>{ const g=el("g",{}); elevG[e.id]=g; const x=shaftX(e.id);
  const top=e.launches?lBot:Math.min(...e.stops.map(floorMid))-18;
  el("rect",{x:x-13,y:top,width:26,height:doorTop-top,rx:3,fill:"var(--shaft)"},g);
  el("path",{d:`M${x} ${doorTop} V${e.launches?lBot+2:Math.min(...e.stops.map(floorMid))}`,stroke:colLine(e.id),"stroke-width":6,"stroke-linecap":"round"},g);
  if(e.launches) el("path",{d:`M${x-8} ${lBot-3} L${x} ${lTop+3} L${x+8} ${lBot-3} z`,fill:colLine(e.id)},g);
  e.stops.forEach(s=>el("circle",{cx:x,cy:floorMid(s),r:e.launches?6.5:7.5,fill:"var(--card)",stroke:colLine(e.id),"stroke-width":3},g));
  el("rect",{x:x-26,y:doorTop,width:52,height:doorBot-doorTop,rx:4,fill:"var(--card)",stroke:colLine(e.id),"stroke-width":2.5},g);
  el("rect",{x:x-26,y:doorTop,width:52,height:7,rx:3,fill:colLine(e.id)},g);
  e.name.forEach((t,j)=>txt(t,{x,y:deskY+4+(j-(e.name.length-1)/2)*13,"text-anchor":"middle","font-size":10.5,class:"disp"},g));
});
// building frame
el("rect",{x:BX1,y:aTop,width:BX2-BX1,height:ground-aTop,fill:"none",stroke:"var(--frame)","stroke-width":4},B.roof);
// rules highlights
const hlG=el("g",{});
const hlStreet=el("rect",{x:38,y:ground+12,width:420,height:48,rx:8,fill:"none",stroke:"var(--law)","stroke-width":3},hlG);
const hlRules=el("rect",{x:rulesB.x-5,y:rulesB.y-5,width:rulesB.w+10,height:rulesB.h+10,rx:9,fill:"none",stroke:"var(--law)","stroke-width":3},hlG);
const hlUnits=el("g",{},hlG); tagEls.forEach(t=>el("rect",{x:t.x-4,y:t.y-4,width:t.w+8,height:t.h+8,rx:5,fill:"none",stroke:"var(--law)","stroke-width":2.5},hlUnits));
const tokLayer=el("g",{});

// story panel (left)
const head=el("g",{});
txt(EYEBROW,{x:50,y:62,"font-size":13,"font-weight":700,"letter-spacing":"1.6",fill:"var(--muted)"},head);
const hChip=el("g",{},head); const hChipR=el("rect",{x:50,y:82,height:28,rx:14,fill:"var(--ink)"},hChip); const hChipT=txt("",{x:64,y:101,"font-size":14,"font-weight":700,fill:"#fff"},hChip);
const hTitle=el("text",{x:50,y:150,"font-size":32,class:"disp"},head);

const cap=el("g",{});
const capBox=el("rect",{x:50,y:300,width:450,height:200,rx:16,fill:"var(--card)",stroke:"var(--rule)"},cap);
const capBar=el("rect",{x:50,y:300,width:8,height:200,rx:4,fill:"var(--ink)"},cap);

const capWhoR=el("rect",{x:80,y:356,height:26,rx:13,fill:"var(--lobby)"},cap); const capWhoT=txt("",{x:92,y:374,"font-size":13.5,"font-weight":700},cap);
const capTx=el("text",{x:80,y:414,"font-size":17,fill:"var(--muted)"},cap);

/* text wrapping */
function wrap(node,str,maxW,lh,x){ if(node._s===str) return node._n||1; node._s=str; node.textContent=""; const words=String(str||"").split(/\s+/).filter(Boolean); let line=[], n=0;
  const mk=()=>{ const t=document.createElementNS(NS,"tspan"); t.setAttribute("x",x); t.setAttribute("dy",n===0?0:lh); node.appendChild(t); n++; return t; };
  let ts=mk();
  words.forEach(w=>{ line.push(w); ts.textContent=line.join(" "); if(ts.getComputedTextLength()>maxW&&line.length>1){ line.pop(); ts.textContent=line.join(" "); line=[w]; ts=mk(); ts.textContent=w; } });
  node._n=n; return n; }
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ [hTitle,hSub,capTx].forEach(n=>n._s=null); });

/* ---------- planning the trips ---------- */
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function P(id,tr,elev){
  if(id==="@from") return {...ap(tr.from),k:"apt"};
  if(id==="@apt") return {...ap(tr.to||tr.from),k:"apt"};
  if(id==="@desk") return {x:deskX2-2,y:deskY,k:"desk"};
  if(id==="@roof") return {x:hut.x2-34,y:hut.cy+6,k:"roof"};
  if(id==="@launch") return {x:shaftX(elev),y:(lTop+lBot)/2,k:"launch"};
  if(id==="@foundation") return {x:shaftX(elev),y:(foundTop+foundBot)/2,k:"shaft"};
  return {x:shaftX(elev),y:floorMid(id),k:"shaft",fl:id};
}
function ap(id){ const b=aptBox[id]; return {x:b.cx,y:b.cy}; }
function route(a,b){
  if(a.x===b.x&&a.y===b.y) return [];
  if(a.k==="launch"&&b.k==="apt") return [{x:b.x,y:a.y},b];
  if(a.k==="apt"&&b.k==="roof") return [{x:a.x,y:b.y},b];
  if(a.k==="roof"&&b.k==="desk") return [{x:FX,y:a.y},{x:FX,y:b.y},b];
  if(a.k==="desk"&&(b.k==="shaft"||b.k==="launch")) return [{x:b.x,y:a.y},b];
  if((a.k==="shaft"||a.k==="launch")&&b.k==="desk") return [{x:a.x,y:b.y},b];
  return [b];
}
function plan(tr,start){
  let t=start+(tr.delay||0), prev=null; const kf=[]; const loop=tr.elevator==="loop"; const elev=loop?tr.rejoin:tr.elevator;
  let color=loop?"loop":tr.elevator, reachedDesk=false;
  tr.stops.forEach(s=>{ const [id,title,who,text,secs]=s; const p=P(id,tr,elev);
    if(prev){ route(prev,p).forEach((w,j,arr)=>{ t+=dist(prev,w)/TIMING.speed; if(j<arr.length-1) kf.push({...w,t,hold:0,color}); prev=w; }); }
    if(loop&&id==="@desk"&&!reachedDesk){ reachedDesk=true; }
    const hold=secs!=null?secs:(title?2:TIMING.passBy);
    kf.push({...p,t,hold,id,card:title?[title,who||"",text||""]:null,color}); t+=hold; prev=p;
    if(loop&&reachedDesk) color=tr.rejoin;
  });
  tr.kf=kf; tr.end=t; return t;
}
let T=0, tripNo=0;
SCENES.forEach((s,i)=>{ s.id="s"+i; s.trips=s.trips||[]; s.start=T;
  if(s.type==="all"){ s.trips=[]; (s.order||ELEVATORS.map(e=>e.id)).forEach((id,k)=>{ const e=EID[id]; const st=[["@desk",null,null,null,0.2]].concat(e.stops.map(x=>[x,null,null,null,0.25])); if(e.launches) st.push(["@launch",null,null,null,0.2]);
      const tr={elevator:id,from:Object.keys(aptBox)[k%Object.keys(aptBox).length],stops:st,delay:0.4+k*1.0}; plan(tr,T); s.trips.push(tr); }); }
  else if(s.type==="rules"){ let t=1.0; s.steps.forEach(st=>{ st.t=t; t+=st.seconds||4; }); s.seconds=s.seconds||t+0.8; }
  else if(s.type!=="intro"&&s.type!=="end"){ let end=T+1.2; s.trips.forEach(tr=>{ end=Math.max(end,plan(tr,T+1.2)); }); if(s.trips.length){ tripNo++; s.no=tripNo; } s.seconds=s.seconds||(end-T+1.2); }
  s.seconds=s.seconds||9; T+=s.seconds; });
const TOTAL=T;
const ENDS=SCENES.find(s=>s.type==="end");
if(ENDS){ el("rect",{x:0,y:0,width:1280,height:720,fill:"var(--paper)"},endG); const n=ENDS.lines.length;
  ENDS.lines.forEach((l,i)=>txt(l,{x:640,y:340-(n-1)*35+i*70,"text-anchor":"middle","font-size":52,class:"disp"},endG));
  if(ENDS.footer) txt(ENDS.footer,{x:640,y:340+(n-1)*35+80,"text-anchor":"middle","font-size":17,fill:"var(--muted)"},endG); }

/* ---------- tokens: work orders ---------- */
function mkTok(){ const g=el("g",{},tokLayer); const halo=el("circle",{r:20,fill:"none","stroke-width":2.5,opacity:0},g);
  el("rect",{x:-14,y:-10,width:28,height:20,rx:5,fill:"#fff"},g); const c=el("rect",{x:-11,y:-7,width:22,height:14,rx:3},g);
  el("path",{d:"M-6 -2 h12 M-6 2 h8",stroke:"#fff","stroke-width":1.6,"stroke-linecap":"round"},g); return {g,c,halo}; }
const pool=[]; for(let i=0;i<16;i++) pool.push(mkTok());
const ease=x=>x<.5?2*x*x:1-((-2*x+2)**2)/2;
function posAt(tk,t){
  const kf=tk.kf; if(!kf.length||t<kf[0].t||t>tk.end+0.6) return null;
  for(let i=0;i<kf.length;i++){ const k=kf[i];
    if(t<=k.t+k.hold){ if(t>=k.t) return {x:k.x,y:k.y,at:k,color:k.color,stop:k.hold>0.3};
      const q=kf[i-1]; const p=(t-(q.t+q.hold))/Math.max(0.0001,(k.t-(q.t+q.hold))); const e=ease(Math.max(0,Math.min(1,p)));
      return {x:q.x+(k.x-q.x)*e,y:q.y+(k.y-q.y)*e,at:null,color:q.color}; } }
  const l=kf[kf.length-1]; return {x:l.x,y:l.y,at:l,color:l.color,fade:Math.max(0,1-(t-tk.end)/0.6)};
}

/* ---------- render one moment ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fadeIn=(t,a,d=.5)=>clamp((t-a)/d,0,1);
const sceneEls=s=>{ if(s.elevators) return s.elevators; if(s.type==="all"||s.type==="intro"||s.type==="rules") return null; const set=new Set(); s.trips.forEach(tr=>{ set.add(tr.elevator); if(tr.rejoin) set.add(tr.rejoin); }); return [...set]; };
const sceneColor=s=>{ const e=sceneEls(s); if(!e||!e.length) return "var(--ink)"; return col(e[0]); };
function setCaption(title,who,text,color,op){
  capSt.textContent=title; capWhoT.textContent=who;
  if(who){ capWhoR.setAttribute("width",capWhoT.getComputedTextLength()+24); capWhoR.setAttribute("opacity",1); } else capWhoR.setAttribute("opacity",0);
  capTx.setAttribute("y",who?414:384);
  const n=text?wrap(capTx,text,400,25,80):(capTx.textContent="",capTx._s="",0);
  const h=Math.max(110,(who?114:84)+n*25);
  capBox.setAttribute("height",h); capBar.setAttribute("height",h);
  capBar.setAttribute("fill",color); cap.setAttribute("opacity",op);
}
const ORDER=["ground","found","lobby","floors","launch","apts","roof","loop"];
function render(t){
  t=clamp(t,0,TOTAL);
  const s=SCENES.find(x=>t>=x.start&&t<x.start+x.seconds)||SCENES[SCENES.length-1];
  const lt=t-s.start;
  const fade=Math.min(fadeIn(lt,0,.5),1-fadeIn(lt,s.seconds-.4,.4));
  // header
  let y=150;
  if(s.no){ hChipT.textContent=`Trip ${s.no}`; hChipR.setAttribute("width",hChipT.getComputedTextLength()+28); hChip.setAttribute("opacity",1); }
  else hChip.setAttribute("opacity",0);
  hChipR.setAttribute("fill",sceneColor(s));
  const nt=wrap(hTitle,s.title||"",440,38,50); hSub.setAttribute("y",150+(nt-1)*38+40); const ns=wrap(hSub,s.sub||"",440,24,50);
  head.setAttribute("opacity",s.type==="end"?0:fade);
  const capTop=150+(nt-1)*38+40+(ns-1)*24+50;
  cap.setAttribute("transform",`translate(0 ${Math.max(0,capTop-300)})`);
  // building
  ORDER.forEach((k,i)=>B[k].setAttribute("opacity",s.type==="intro"?fadeIn(lt,0.3+i*0.45,.5):1));
  const act=sceneEls(s);
  const on=k=>!act||act.includes(k);
  Object.keys(elevG).forEach((k,i)=>elevG[k].setAttribute("opacity",s.type==="intro"?fadeIn(lt,3.2+i*0.25,.4):(on(k)?1:0.14)));
  if(s.type!=="intro") B.loop.setAttribute("opacity",on("loop")?1:0.18);
  // apartments involved in this scene
  const involved=new Set(); s.trips.forEach(tr=>{ if(s.type!=="all"){ involved.add(tr.from); if(tr.to) involved.add(tr.to); } });
  Object.keys(aptHl).forEach(k=>aptHl[k].setAttribute("opacity",involved.has(k)?fade:0));
  // rules highlights
  let rulesCard=null;
  [hlStreet,hlRules,hlUnits].forEach(n=>n.setAttribute("opacity",0));
  if(s.type==="rules"){ s.steps.forEach(st=>{ if(lt>=st.t&&lt<st.t+(st.seconds||4)){ rulesCard=st; const n={street:hlStreet,rules:hlRules,units:hlUnits}[st.target]; if(n) n.setAttribute("opacity",0.45+0.55*(0.5+0.5*Math.sin((lt-st.t)*5))); } }); }
  // tokens
  if(s!==render.s){ render.s=s; render.last=null; }
  let used=0, card=null;
  Object.values(floorName).forEach(n=>n.setAttribute("fill","var(--ink)"));
  desk.setAttribute("stroke","var(--frame)"); hutR.setAttribute("stroke","var(--loop-ink)");
  s.trips.forEach(tk=>{ const p=posAt(tk,t); if(!p) return; const o=pool[used++]; if(!o) return;
    o.g.setAttribute("transform",`translate(${p.x},${p.y})`); o.g.setAttribute("opacity",p.fade!=null?p.fade:1);
    const cc=col(p.color); o.c.setAttribute("fill",cc); o.halo.setAttribute("stroke",cc);
    const pulse=p.stop?(0.5+0.5*Math.sin((t-p.at.t)*6)):0; o.halo.setAttribute("opacity",p.stop?0.25+0.45*pulse:0); o.halo.setAttribute("r",17+4*pulse);
    if(p.at&&p.at.card&&p.stop&&s.type!=="all") card={c:p.at.card,color:cc};
    if(p.at&&p.stop){ if(p.at.fl&&floorName[p.at.fl]) floorName[p.at.fl].setAttribute("fill",cc); if(p.at.k==="desk") desk.setAttribute("stroke",cc); if(p.at.k==="roof") hutR.setAttribute("stroke",cc); } });
  pool.slice(used).forEach(o=>o.g.setAttribute("opacity",0));
  if(rulesCard){ setCaption(rulesCard.title,rulesCard.who||"",rulesCard.text||"","var(--law)",1); }
  else if(card){ setCaption(card.c[0],card.c[1],card.c[2],card.color,1); render.last=card; }
  else if(s.type==="intro"||s.type==="all"){ setCaption(s.captionTitle||"","",s.captionText||"","var(--ink)",fadeIn(lt,s.type==="intro"?4.5:0.5,.5)); }
  else if(render.last){ const c=render.last; setCaption(c.c[0],c.c[1],c.c[2],c.color,0.55); }
  else cap.setAttribute("opacity",0);
  endG.setAttribute("opacity",s.type==="end"?fadeIn(lt,0,.6):0);
  dots.innerHTML=""; SCENES.forEach((x,i)=>el("circle",{cx:56+i*16,cy:612,r:4.5,fill:x===s?"var(--ink)":"var(--rule)"},dots));
  dots.setAttribute("opacity",s.type==="end"?0:1);
  return s;
}

/* ---------- playback controls ---------- */
let cur=0, playing=!matchMedia("(prefers-reduced-motion: reduce)").matches, last=null;
const fmtT=x=>`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,"0")}`;
const ctl=document.getElementById("controls"), scrub=document.getElementById("scrub");
document.getElementById("tend").textContent=fmtT(TOTAL);
ctl.innerHTML=`<button type="button" class="play" id="playBtn">${playing?"Pause":"Play"}</button>`;
SCENES.filter(s=>s.type!=="end").forEach(s=>{ const b=document.createElement("button"); b.type="button"; b.dataset.s=s.id; const c=s.type==="rules"?"var(--law)":sceneColor(s); b.style.setProperty("--c",c==="var(--loop-ink)"?"var(--loop)":c); b.innerHTML="<i></i>"; b.appendChild(document.createTextNode(s.button||(s.type==="intro"?"Intro":s.title)||"Scene")); ctl.appendChild(b); });
const playBtn=document.getElementById("playBtn");
function update(){ const s=render(cur); scrub.value=Math.round(cur/TOTAL*1000); document.getElementById("tnow").textContent=fmtT(cur);
  ctl.querySelectorAll("[data-s]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===s.id)); }
function frame(ts){ if(window.CAPTURE) return; if(playing){ if(last!=null) cur+=(ts-last)/1000; if(cur>=TOTAL) cur=0; } last=ts; update(); requestAnimationFrame(frame); }
playBtn.addEventListener("click",()=>{ playing=!playing; playBtn.textContent=playing?"Pause":"Play"; });
ctl.addEventListener("click",e=>{ const b=e.target.closest("[data-s]"); if(!b) return; cur=SCENES.find(s=>s.id===b.dataset.s).start+0.01; update(); });
scrub.addEventListener("input",()=>{ cur=scrub.value/1000*TOTAL; update(); });
document.addEventListener("keydown",e=>{ if(e.key===" "&&e.target===document.body){ e.preventDefault(); playBtn.click(); } });
window.renderAt=t=>{ cur=t; render(t); }; window.TOTAL=TOTAL; window.SCENES=SCENES;
window.setCapture=()=>{ window.CAPTURE=true; document.body.classList.add("capture"); };
update(); requestAnimationFrame(frame);
} catch(e){
  const box=document.getElementById("err"); box.hidden=false;
  box.innerHTML="<b>The animation can't start because of a mistake in the EDIT HERE block.</b>";
  const pre=document.createElement("div"); pre.style.whiteSpace="pre-wrap"; pre.textContent=String(e.message||e)+"\n\nUndo your last change, or compare it with the examples in the guide."; box.appendChild(pre);
}
</script>
